<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사이트 리스트</title>
  <style>
    a {
      color: white;
    }
    @font-face {
      font-family: 'font';
      src: url('font/paperlogy.ttf') format('truetype');
    }
  </style>
</head>
<body style="background-color: black; text-align: center; color: white; font-family: 'font', paperlogy;">
  <div style="opacity: 0; max-height: 0px; overflow: hidden; transition: max-height 1s ease, opacity 1s ease" id="start">
    <div style="display: flex; justify-content: center; margin-top: 50px">
      <img src="logo.jpg" width="200px" style="margin:0">
    </div>
    <br><br>
    <h1 style="margin-top: 0">웹사이트 목록</h1>
    <p>
      이전에 만들어둔 사이트들 입니다 | <a href="http://oldh.kaps.kro.kr/">이전 사이트</a> | <a href="index.html">홈페이지</a>
    </p>

    <br><hr style="width: 50%; border: 0.5px solid #444;"><br>

		<h2>죄송합니다만</h2>
    <p>사이트 목록들은 보여드릴 수 없습니다<br>너무 흑역사가 많거든요</p>
    <p>나중에 시간이 되면 한 번 리스트들 정리해서<br>여기에 올려둘게요.</p>

    <br><br>
    <hr>
    <div style="display: flex; justify-content: center; width: 100%; text-align: center;">
      <p>
        미니멀리즘 디자인
      </p>
    </div>
  </div>
</body>
<script>
  setTimeout(() => {
    document.getElementById("start").style.opacity = "1";
    document.getElementById("start").style.maxHeight = "100vh";
  }, 100)
  setTimeout(() => {
    document.getElementById("start").style.maxHeight = "100%";
  }, 1000)
</script>
</html>
